<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EazyLife Delivery Checkpoints</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<main class="max-w-5xl mx-auto p-5">
  <header class="mb-6">
    <a href="delivery.html" class="text-sm text-emerald-700">← Delivery</a>
    <h1 class="text-2xl font-black mt-3">Delivery Checkpoints</h1>
    <p class="text-sm text-slate-500">Manage places and stages used while tracking deliveries.</p>
  </header>
  <section class="bg-white rounded-2xl border p-4 mb-5">
    <form id="checkpointForm" class="grid md:grid-cols-[1fr_1fr_auto] gap-3">
      <input id="name" required class="border rounded-xl px-3 py-2" placeholder="Checkpoint name">
      <input id="description" class="border rounded-xl px-3 py-2" placeholder="Description / location">
      <button class="bg-slate-900 text-white rounded-xl px-5 py-2 font-bold">Add</button>
    </form>
  </section>
  <section id="list" class="grid md:grid-cols-2 gap-3"><p class="text-slate-500">Loading...</p></section>
</main>
<script type="module">
import { watchDeliveryCheckpoints, addDeliveryCheckpoint, updateDeliveryCheckpoint, deleteDeliveryCheckpoint } from './js/delivery-store.mjs';
const list=document.querySelector('#list');
document.querySelector('#checkpointForm').addEventListener('submit',async e=>{
 e.preventDefault();
 await addDeliveryCheckpoint({name:document.querySelector('#name').value.trim(),description:document.querySelector('#description').value.trim(),active:true,createdAt:Date.now()});
 e.target.reset();
});
watchDeliveryCheckpoints(items=>{
 list.innerHTML=items.length?items.map(x=>`<article class="bg-white border rounded-2xl p-4 flex justify-between gap-4"><div><h2 class="font-black">${escapeHtml(x.name)}</h2><p class="text-sm text-slate-500">${escapeHtml(x.description||'')}</p></div><button data-id="${x.id}" class="text-red-600 font-bold">Delete</button></article>`).join(''):'<p class="text-slate-500">No checkpoints yet.</p>';
});
list.addEventListener('click',async e=>{if(e.target.dataset.id) await deleteDeliveryCheckpoint(e.target.dataset.id)});
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
</script>
</body></html>
