<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EazyLife Inventory Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>body{font-family:'DM Sans',sans-serif}h1,h2,h3{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-6"><div class="bg-white w-full max-w-sm rounded-2xl shadow p-6"><h1 class="text-xl font-black text-center">Inventory Reports</h1><p class="text-xs text-gray-400 text-center mt-1 mb-5">EazyLife Admin</p><input id="email" type="email" placeholder="Admin email" class="w-full p-3 mb-2 rounded-xl bg-gray-50 border text-sm"><input id="password" type="password" placeholder="Password" class="w-full p-3 mb-3 rounded-xl bg-gray-50 border text-sm"><button id="login" class="w-full py-3 rounded-xl bg-gray-900 text-white font-bold text-sm">Log In</button><p id="error" class="text-xs text-red-500 mt-2 hidden"></p></div></div>
  <main id="app" class="hidden max-w-5xl mx-auto p-4 md:p-6">
    <div class="flex items-center justify-between mb-5"><div><h1 class="text-2xl font-black">Inventory Reports</h1><p class="text-xs text-gray-400">Current stock valuation and inventory health.</p></div><button id="logout" class="text-xs font-bold text-gray-500">Log out</button></div>
    <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5"></div>
    <div class="grid md:grid-cols-2 gap-4">
      <section class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4"><div class="flex justify-between items-center mb-3"><div><h2 class="text-base font-black">By Category</h2><p class="text-[10px] text-gray-400">Current stock at cost.</p></div></div><div id="categoryRows" class="space-y-2"></div></section>
      <section class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4"><div class="flex justify-between items-center mb-3"><div><h2 class="text-base font-black">By Product</h2><p class="text-[10px] text-gray-400">Current stock at cost.</p></div></div><div id="productRows" class="space-y-2"></div></section>
    </div>
    <section class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 mt-4"><div class="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-3"><div><h2 class="text-base font-black">Valuation Detail</h2><p class="text-[10px] text-gray-400">Variant-level quantity × current cost price.</p></div><input id="search" placeholder="Search product / SKU..." class="p-2.5 bg-gray-50 rounded-xl border text-xs outline-none w-full md:w-64"></div><div id="detailRows" class="space-y-2"></div></section>
  </main>
<script type="module">
import { initFirebase } from '../js/firebase.mjs';
import { collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
const { db, auth } = initFirebase();
const money = v => `₦${Number(v||0).toLocaleString()}`;
const esc = v => String(v ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const label = (v,i) => [v.processor,v.ram,v.rom,v.color].filter(Boolean).join(' / ') || `Variant ${i+1}`;
let products=[];
function rows(){return products.flatMap(p=>(p.variants||[]).map((v,i)=>({productId:p.id,productName:p.name||'Unnamed product',brand:p.brand||'',category:p.category||'Uncategorized',variant:v,variantIndex:i,sku:v.sku||'',qty:Number(v.stockQty||0),cost:Number(v.costPrice||0)})));}
function render(){const rs=rows();const totalUnits=rs.reduce((n,r)=>n+r.qty,0);const totalValue=rs.reduce((n,r)=>n+r.qty*r.cost,0);const low=rs.filter(r=>r.qty>0&&r.qty<=Number(r.variant.reorderLevel??2)).length;const out=rs.filter(r=>r.qty<=0).length;
 document.getElementById('summary').innerHTML=`<div class="bg-white rounded-2xl border p-4"><p class="text-[10px] uppercase font-black text-gray-400">Inventory value</p><p class="text-xl font-black mt-1">${money(totalValue)}</p></div><div class="bg-white rounded-2xl border p-4"><p class="text-[10px] uppercase font-black text-gray-400">Units</p><p class="text-xl font-black mt-1">${totalUnits.toLocaleString()}</p></div><div class="bg-white rounded-2xl border p-4"><p class="text-[10px] uppercase font-black text-gray-400">Low stock</p><p class="text-xl font-black mt-1 text-orange-500">${low}</p></div><div class="bg-white rounded-2xl border p-4"><p class="text-[10px] uppercase font-black text-gray-400">Out of stock</p><p class="text-xl font-black mt-1 text-red-500">${out}</p></div>`;
 const cats={};rs.forEach(r=>{if(!cats[r.category])cats[r.category]={units:0,value:0};cats[r.category].units+=r.qty;cats[r.category].value+=r.qty*r.cost});
 document.getElementById('categoryRows').innerHTML=Object.entries(cats).sort((a,b)=>b[1].value-a[1].value).map(([k,v])=>`<div class="flex justify-between gap-3 border-b border-gray-50 py-2"><div><p class="text-xs font-bold">${esc(k)}</p><p class="text-[10px] text-gray-400">${v.units.toLocaleString()} units</p></div><span class="text-xs font-black">${money(v.value)}</span></div>`).join('')||'<p class="text-xs text-gray-400">No inventory.</p>';
 const prods={};rs.forEach(r=>{if(!prods[r.productId])prods[r.productId]={name:r.productName,units:0,value:0};prods[r.productId].units+=r.qty;prods[r.productId].value+=r.qty*r.cost});
 document.getElementById('productRows').innerHTML=Object.values(prods).sort((a,b)=>b.value-a.value).map(v=>`<div class="flex justify-between gap-3 border-b border-gray-50 py-2"><div class="min-w-0"><p class="text-xs font-bold truncate">${esc(v.name)}</p><p class="text-[10px] text-gray-400">${v.units.toLocaleString()} units</p></div><span class="text-xs font-black">${money(v.value)}</span></div>`).join('')||'<p class="text-xs text-gray-400">No inventory.</p>';
 drawDetail(rs);
}
function drawDetail(rs){const q=(document.getElementById('search')?.value||'').toLowerCase();const filtered=rs.filter(r=>`${r.productName} ${r.sku} ${label(r.variant,r.variantIndex)}`.toLowerCase().includes(q));document.getElementById('detailRows').innerHTML=filtered.map(r=>`<div class="flex flex-col md:flex-row md:items-center gap-2 border-b border-gray-50 py-2"><div class="flex-grow min-w-0"><p class="text-xs font-bold truncate">${esc(r.productName)}</p><p class="text-[10px] text-gray-400">${esc(label(r.variant,r.variantIndex))}${r.sku?' · '+esc(r.sku):''}</p></div><span class="text-xs font-black">${r.qty.toLocaleString()} units</span><span class="text-xs text-gray-500">${money(r.cost)} cost</span><span class="text-xs font-black w-28 text-right">${money(r.qty*r.cost)}</span></div>`).join('')||'<p class="text-xs text-gray-400 py-4 text-center">No matching variants.</p>'}
document.getElementById('search').addEventListener('input',()=>drawDetail(rows()));
document.getElementById('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);document.getElementById('error').classList.add('hidden')}catch(e){const x=document.getElementById('error');x.textContent='Login failed — check email and password.';x.classList.remove('hidden')}};
document.getElementById('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{document.getElementById('loginScreen').classList.toggle('hidden',!!user);document.getElementById('app').classList.toggle('hidden',!user);if(user){onSnapshot(collection(db,'products'),snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()}));render()})}});
</script>
</body></html>
