<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery Personnel</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 text-slate-900"><main class="max-w-6xl mx-auto p-5">
<header class="mb-6"><a href="delivery.html" class="text-sm text-emerald-700">← Delivery</a><h1 class="text-2xl font-black mt-3">Delivery Personnel</h1><p class="text-sm text-slate-500">Manage your delivery team and their contact details.</p></header>
<section class="bg-white border rounded-2xl p-4 mb-5"><form id="form" class="grid md:grid-cols-4 gap-3"><input id="name" required class="border rounded-xl px-3 py-2" placeholder="Full name"><input id="phone" required class="border rounded-xl px-3 py-2" placeholder="Phone"><input id="email" class="border rounded-xl px-3 py-2" placeholder="Email"><select id="active" class="border rounded-xl px-3 py-2"><option value="true">Active</option><option value="false">Inactive</option></select><button class="md:col-span-4 bg-slate-900 text-white rounded-xl px-4 py-2 font-bold">Add Delivery Personnel</button></form></section>
<section id="list" class="grid md:grid-cols-2 gap-4"></section></main>
<script type="module">
import {watchDeliveryPersonnel,addDeliveryPersonnel,updateDeliveryPersonnel,deleteDeliveryPersonnel} from './js/delivery-store.mjs';
const list=document.querySelector('#list');
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();await addDeliveryPersonnel({name:name.value.trim(),phone:phone.value.trim(),email:email.value.trim(),active:active.value==='true',createdAt:Date.now(),updatedAt:Date.now()});e.target.reset();});
watchDeliveryPersonnel(items=>{list.innerHTML=items.length?items.map(p=>`<article class="bg-white border rounded-2xl p-4"><div class="flex justify-between gap-3"><div><h2 class="font-black text-lg">${esc(p.name)}</h2><p class="text-sm text-slate-500">${esc(p.phone)}${p.email?' · '+esc(p.email):''}</p></div><span class="px-2 py-1 rounded-full text-xs font-bold ${p.active?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-500'}">${p.active?'ACTIVE':'INACTIVE'}</span></div><div class="flex gap-2 mt-4"><a class="px-3 py-2 rounded-lg bg-emerald-600 text-white text-sm font-bold" href="https://wa.me/${String(p.phone||'').replace(/\D/g,'')}" target="_blank">WhatsApp</a><a class="px-3 py-2 rounded-lg border text-sm font-bold" href="tel:${esc(p.phone)}">Call</a><button data-toggle="${p.id}" data-active="${p.active}" class="px-3 py-2 rounded-lg border text-sm font-bold">${p.active?'Deactivate':'Activate'}</button><button data-delete="${p.id}" class="px-3 py-2 rounded-lg border border-red-200 text-red-600 text-sm font-bold">Delete</button></div></article>`).join(''):'<p class="text-slate-500">No delivery personnel yet.</p>');});
list.addEventListener('click',async e=>{const t=e.target;if(t.dataset.toggle){await updateDeliveryPersonnel(t.dataset.toggle,{active:t.dataset.active!=='true',updatedAt:Date.now()});}if(t.dataset.delete&&confirm('Delete this delivery personnel?'))await deleteDeliveryPersonnel(t.dataset.delete);});
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
</script></body></html>
