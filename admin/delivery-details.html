<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery Queue</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 text-slate-900"><main class="max-w-7xl mx-auto p-5">
<header class="mb-6"><a href="delivery.html" class="text-sm text-emerald-700">← Delivery</a><h1 class="text-2xl font-black mt-3">Delivery Queue</h1><p class="text-sm text-slate-500">Assign confirmed orders and move deliveries through their operational stages.</p></header>
<section class="grid grid-cols-2 md:grid-cols-6 gap-2 mb-5" id="stats"></section>
<section id="list" class="space-y-4"><p class="text-slate-500">Loading deliveries...</p></section></main>
<script type="module">
import {watchDeliveries,watchDeliveryPersonnel,watchDeliveryTypes,watchDeliveryCheckpoints,updateDelivery} from './js/delivery-store.mjs';
import {DELIVERY_STATES,DELIVERY_STATE_LABELS,canTransitionDelivery} from './js/delivery-lifecycle.mjs';
let deliveries=[],people=[],types=[],checkpoints=[];
const list=document.querySelector('#list'),stats=document.querySelector('#stats');
const render=()=>{const counts=Object.values(DELIVERY_STATES).reduce((a,s)=>(a[s]=deliveries.filter(d=>d.status===s).length,a),{});stats.innerHTML=Object.entries(DELIVERY_STATE_LABELS).map(([s,l])=>`<div class="bg-white border rounded-xl p-3"><div class="text-xl font-black">${counts[s]||0}</div><div class="text-[11px] text-slate-500">${l}</div></div>`).join('');list.innerHTML=deliveries.length?deliveries.map(d=>card(d)).join(''):'<div class="bg-white border rounded-2xl p-8 text-center text-slate-500">No deliveries yet.</div>';};
function card(d){const person=people.find(p=>p.id===d.assignedTo);const type=types.find(t=>t.id===d.deliveryTypeId);const status=d.status||'ready';const next={ready:'assigned',assigned:'picked_up',picked_up:'in_transit',in_transit:'checkpoint',checkpoint:'delivered',failed:'assigned',returned:'assigned'}[status];return `<article class="bg-white border rounded-2xl p-4 shadow-sm"><div class="flex flex-wrap justify-between gap-3"><div><div class="text-xs text-slate-400 font-bold">ORDER ${esc(d.orderId||'—')}</div><h2 class="font-black text-lg">${esc(d.customerName||'Unknown customer')}</h2><p class="text-sm text-slate-500">${esc(d.address||'No delivery address')}</p></div><span class="h-fit px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-black">${esc(DELIVERY_STATE_LABELS[status]||status)}</span></div><div class="grid md:grid-cols-3 gap-3 mt-4"><label class="text-xs font-bold text-slate-500">Delivery Type<select data-type="${d.id}" class="mt-1 w-full border rounded-xl px-3 py-2"><option value="">${type?.name||'Select type'}</option>${types.filter(t=>t.active!==false).map(t=>`<option value="${t.id}" ${d.deliveryTypeId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label class="text-xs font-bold text-slate-500">Delivery Personnel<select data-person="${d.id}" class="mt-1 w-full border rounded-xl px-3 py-2"><option value="">${person?.name||'Unassigned'}</option>${people.filter(p=>p.active!==false).map(p=>`<option value="${p.id}" ${d.assignedTo===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div class="flex items-end gap-2"><button data-next="${d.id}" data-state="${next||''}" ${next?'':'disabled'} class="flex-1 bg-slate-900 text-white rounded-xl px-3 py-2 font-bold disabled:opacity-30">${next?`Move to ${DELIVERY_STATE_LABELS[next]}`:'Complete'}</button><button data-fail="${d.id}" class="px-3 py-2 border border-red-200 text-red-600 rounded-xl font-bold">Fail</button></div></div>${status==='checkpoint'?`<div class="mt-3"><label class="text-xs font-bold text-slate-500">Checkpoint<select data-checkpoint="${d.id}" class="mt-1 w-full border rounded-xl px-3 py-2"><option value="">Select checkpoint</option>${checkpoints.filter(c=>c.active!==false).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label></div>`:''}<div class="mt-3 text-xs text-slate-400">${person?.phone?`Assigned: ${esc(person.name)} · ${esc(person.phone)}`:'No personnel assigned'}${type?.name?' · '+esc(type.name):''}</div></article>`;}
list.addEventListener('change',async e=>{const t=e.target;if(t.dataset.type)await updateDelivery(t.dataset.type,{deliveryTypeId:t.value||null,updatedAt:Date.now()});if(t.dataset.person){const p=people.find(x=>x.id===t.value);if(p)await updateDelivery(t.dataset.person,{assignedTo:p.id,assignedToName:p.name,assignedToPhone:p.phone||'',status:'assigned',assignedAt:Date.now(),updatedAt:Date.now()});}if(t.dataset.checkpoint)await updateDelivery(t.dataset.checkpoint,{lastCheckpointId:t.value||null,lastCheckpointAt:Date.now(),updatedAt:Date.now()});});
list.addEventListener('click',async e=>{const t=e.target;if(t.dataset.next){const d=deliveries.find(x=>x.id===t.dataset.next),to=t.dataset.state;if(d&&canTransitionDelivery(d.status||'ready',to)){const now=Date.now(),p={status:to,updatedAt:now};if(to==='picked_up')p.pickedUpAt=now;if(to==='in_transit')p.outForDeliveryAt=now;if(to==='checkpoint')p.lastCheckpointAt=now;if(to==='delivered')p.deliveredAt=now;await updateDelivery(d.id,p);}}if(t.dataset.fail){const d=deliveries.find(x=>x.id===t.dataset.fail);if(d&&canTransitionDelivery(d.status||'ready','failed'))await updateDelivery(d.id,{status:'failed',failedAt:Date.now(),updatedAt:Date.now()});}});
watchDeliveries(x=>{deliveries=x;render()});watchDeliveryPersonnel(x=>{people=x;render()});watchDeliveryTypes(x=>{types=x;render()});watchDeliveryCheckpoints(x=>{checkpoints=x;render()});
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
</script></body></html>
